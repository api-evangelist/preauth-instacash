name: PreAuth (Instacash)
description: >-
  Preauth is a Latin American fintech (the payment-guarantee product associated with the
  Instacash / Reevalúa lineage, surfaced via 500 Global) that lets businesses take and manage
  payment guarantees through card pre-authorization. A merchant creates an order via the REST
  API, the buyer's card is pre-authorized (funds reserved) through the hosted Preauth widget,
  and the merchant can later capture all or part of the reserved amount, update it, cancel it
  to release the hold, or run a card liveness check. It operates across Chile, Colombia,
  Mexico, Peru, and Argentina and integrates with Izipay, Kushki, dLocal, Stripe, Mercadopago,
  and Conekta as payment processors. Authentication is a per-request x-auth-token API key, and
  order lifecycle events are delivered by webhooks.
